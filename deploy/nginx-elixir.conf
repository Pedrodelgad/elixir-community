# Nginx — Elixir (VPS Hostinger / Ubuntu)
# Instalar:
#   sudo cp deploy/nginx-elixir.conf /etc/nginx/sites-available/elixir
#   sudo ln -s /etc/nginx/sites-available/elixir /etc/nginx/sites-enabled/elixir
#   sudo rm -f /etc/nginx/sites-enabled/default
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d seudominio.com -d www.seudominio.com   # adiciona o bloco HTTPS (443) sozinho
#
# Troque "seudominio.com" e o caminho do `root` (dist do build).

server {
    listen 80;
    listen [::]:80;
    server_name seudominio.com www.seudominio.com;

    # Build estático do React (Vite) — rode `npm run build` na raiz e aponte aqui pro dist:
    root /var/www/elixir/dist;
    index index.html;

    # Upload de ferramentas (admin) — limite do backend é 50MB, deixe folga:
    client_max_body_size 55M;

    # API → backend Node (PM2 na :3001). Inclui o webhook do Stripe (corpo RAW é tratado no Node).
    location /api/ {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ⚠️ Arquivos das ferramentas — SEMPRE via Node (exige login + Alpha). NUNCA servir o diretório
    # direto, senão qualquer um com a URL baixa o arquivo (fura a autenticação).
    location /uploads/ {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # React Router (SPA) — qualquer rota que não seja arquivo cai no index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
