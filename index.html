<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Elixir — Comunidade de Trading & Memecoins</title>
    <meta name="description" content="Comunidade cripto de trading e memecoins: calls em tempo real, leitura de mercado, ferramentas e conteúdo exclusivo Alpha. Entre na comunidade da Elixir." />
    <link rel="canonical" href="https://elixiralpha.com/" />
    <meta name="theme-color" content="#020617" />
    <!-- Open Graph (preview ao compartilhar no WhatsApp/Discord/Facebook) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Elixir" />
    <meta property="og:locale" content="pt_BR" />
    <meta property="og:url" content="https://elixiralpha.com/" />
    <meta property="og:title" content="Elixir — Comunidade de Trading & Memecoins" />
    <meta property="og:description" content="Calls em tempo real, leitura de mercado, ferramentas e conteúdo exclusivo Alpha. Entre na comunidade cripto da Elixir." />
    <meta property="og:image" content="https://elixiralpha.com/imgs/logo3d.png" />
    <!-- Twitter / X -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Elixir — Comunidade de Trading & Memecoins" />
    <meta name="twitter:description" content="Calls em tempo real, leitura de mercado e conteúdo exclusivo Alpha. Entre na comunidade cripto da Elixir." />
    <meta name="twitter:image" content="https://elixiralpha.com/imgs/logo3d.png" />
    <!-- Intro: o logo estático aparece no 1º frame (não espera o bundle/WebGL) e o GLB
         começa a baixar já no parse do HTML, não depois do JS executar.
         Só na home e só quando a intro vai mesmo rodar — nas outras rotas e na 2ª visita
         da sessão seriam ~330KB baixados à toa. -->
    <script>
      try {
        if (location.pathname === '/' && sessionStorage.getItem('elixir_intro_done') !== '1') {
          document.head.insertAdjacentHTML('beforeend',
            '<link rel="preload" as="image" href="/imgs/elixir_logo.png" fetchpriority="high">' +
            '<link rel="preload" as="fetch" type="model/gltf-binary" href="/imgs/logo3d.glb" crossorigin="anonymous">' +
            '<link rel="preload" as="fetch" href="/imgs/studio_env.hdr" crossorigin="anonymous">')
        }
      } catch (e) { /* preload é só otimização */ }
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
